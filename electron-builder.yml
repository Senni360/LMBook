# Stable installer identity lets LMBook upgrade an existing SenniBook install.
appId: org.sennibook.desktop
productName: LMBook
directories:
  output: release
files:
  - electron/**/*
  - server-dist/**/*
  - dist/**/*
  - package.json
  - LICENSE
asar: true
extraResources:
  - from: resources/ocr
    to: ocr
  - from: python
    to: python
    filter: ["*.py", "requirements*.txt"]
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: electron/icon.png
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  deleteAppDataOnUninstall: false
portable:
  artifactName: LMBook-${version}-portable.${ext}

mac:
  target:
    - dmg
    - zip
  category: public.app-category.education
  icon: electron/icon.svg
  artifactName: LMBook-${version}-mac-${arch}.${ext}
  # No Developer ID certificate is configured yet; these builds are not notarized.
  identity: "-"
  hardenedRuntime: false
  notarize: false
